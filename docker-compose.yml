services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facturia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturia}
      POSTGRES_DB: ${POSTGRES_DB:-facturia}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facturia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
      - "10002:10002" # table
    volumes:
      - azurite_data:/data

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Override the host-facing defaults in .env (localhost) with the
      # in-network service names — everything else (Azure keys, API_KEY)
      # still comes from .env via env_file above.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facturia}:${POSTGRES_PASSWORD:-facturia}@db:5432/${POSTGRES_DB:-facturia}
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        # Same shared secret as the backend's API_KEY (PROGRESS.md 5.1
        # decision: one key for both the web and the Power Automate flow).
        VITE_API_KEY: ${API_KEY:-change-me}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
  azurite_data:
