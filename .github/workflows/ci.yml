name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: facturia
          POSTGRES_PASSWORD: facturia
          POSTGRES_DB: facturia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facturia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    defaults:
      run:
        working-directory: backend

    env:
      # Matches app.config.settings' defaults (docker-compose.yml's local
      # values), so no per-step overrides needed — the services above
      # already listen on the same ports/credentials.
      DATABASE_URL: postgresql+psycopg://facturia:facturia@localhost:5432/facturia

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest

      - name: Pipeline evals
        working-directory: ${{ github.workspace }}
        run: uv run --project backend python evals/run_evals.py --mock
