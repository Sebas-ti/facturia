server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GET /api/invoices/{id}/events is Server-Sent Events: it must stream
        # as the backend writes it, not wait for nginx to buffer a full response.
        proxy_buffering off;
        proxy_read_timeout 130s;
    }

    # React Router client-side routes (e.g. /invoices/:id) aren't real files —
    # fall back to index.html and let the SPA router handle them.
    location / {
        try_files $uri /index.html;
    }
}
